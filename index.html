<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector de PNG</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header-container">
        <img src="PNG_Inspector.png" alt="PNG Inspector Logo" class="logo">
        <h1>PNG Inspector</h1>
    </div>
    <main class="container">
        <section class="column">
            <div class="image-container" id="imageContainer">
                <label class="upload-message" for="imageInput">Arrastra o selecciona una imagen PNG</label>
                <img id="preview" alt="Vista previa" hidden>
                <button class="close-button" id="closeButton" type="button" aria-label="Cerrar imagen">×</button>
                <input type="file" id="imageInput" accept="image/png" hidden>
            </div>
        </section>
        <section class="column">
            <div class="metadata-section">
                <h2>Metadatos</h2>
                <p id="metadataStatus">Cargá una imagen para inspeccionar sus metadatos.</p>
                <div id="metadataGroups"></div>
                <div class="metadata-actions">
                    <button id="saveButton" disabled>Guardar cambios</button>
                    <button id="removeAllButton" class="delete-button" disabled>Eliminar todos los metadatos</button>
                </div>
            </div>
        </section>
    </main>
<script>
const imageInput = document.getElementById('imageInput');
const preview = document.getElementById('preview');
const saveButton = document.getElementById('saveButton');
const removeAllButton = document.getElementById('removeAllButton');
const metadataGroups = document.getElementById('metadataGroups');
const metadataStatus = document.getElementById('metadataStatus');
const imageContainer = document.getElementById('imageContainer');
let metadata = {};
let currentFile = null;

function categoryFor(key, value) {
    const text = String(value || '');
    const lowerKey = key.toLowerCase();
    if (lowerKey === 'workflow' || (lowerKey === 'prompt' && /"(nodes|links|last_node_id)"\s*:/.test(text))) return 'ComfyUI';
    if (lowerKey === 'parameters' || lowerKey === 'prompt') return 'Forge / Stable Diffusion';
    return 'Otros metadatos';
}

function renderMetadata() {
    metadataGroups.replaceChildren();
    const groups = new Map();
    Object.entries(metadata).forEach(([key, value]) => {
        const title = categoryFor(key, value);
        if (!groups.has(title)) groups.set(title, []);
        groups.get(title).push([key, value]);
    });
    if (!Object.keys(metadata).length) {
        metadataStatus.textContent = 'La imagen no contiene metadatos de texto.';
        return;
    }
    metadataStatus.textContent = 'Editá los campos que quieras conservar o eliminar.';
    groups.forEach((entries, title) => {
        const section = document.createElement('section');
        section.className = 'metadata-group';
        const heading = document.createElement('h3');
        heading.textContent = title;
        section.append(heading);
        entries.forEach(([key, value]) => {
            const field = document.createElement('div');
            field.className = 'metadata-field';
            const label = document.createElement('label');
            label.textContent = key;
            const textarea = document.createElement('textarea');
            textarea.value = value;
            textarea.setAttribute('aria-label', `Metadato ${key}`);
            textarea.addEventListener('input', () => {
                metadata[key] = textarea.value;
                saveButton.disabled = false;
            });
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'field-delete';
            remove.textContent = 'Eliminar campo';
            remove.addEventListener('click', () => {
                delete metadata[key];
                renderMetadata();
                saveButton.disabled = false;
            });
            field.append(label, textarea, remove);
            section.append(field);
        });
        metadataGroups.append(section);
    });
}

async function saveImage(removeAll = false) {
    if (!currentFile) return;
    try {
        const formData = new FormData();
        formData.append('action', 'save');
        formData.append('metadata', JSON.stringify(metadata));
        formData.append('remove_all', String(removeAll));
        formData.append('image', currentFile);
        const response = await fetch('/', { method: 'POST', body: formData });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Error al guardar los metadatos');
        }
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = 'png_metadata_updated.png';
        link.click();
        URL.revokeObjectURL(url);
        alert(removeAll ? 'Se descargó la imagen sin metadatos.' : 'Se descargó la imagen con los cambios.');
    } catch (error) {
        alert('No se pudo guardar: ' + error.message);
    }
}

saveButton.addEventListener('click', () => saveImage());
removeAllButton.addEventListener('click', () => {
    if (confirm('¿Eliminar todos los metadatos de la imagen?')) saveImage(true);
});
document.getElementById('closeButton').addEventListener('click', () => {
    preview.removeAttribute('src');
    preview.hidden = true;
    currentFile = null;
    metadata = {};
    metadataGroups.replaceChildren();
    metadataStatus.textContent = 'Cargá una imagen para inspeccionar sus metadatos.';
    saveButton.disabled = true;
    removeAllButton.disabled = true;
    imageInput.value = '';
});

imageContainer.addEventListener('dragover', event => {
    event.preventDefault();
    imageContainer.classList.add('dragover');
});
imageContainer.addEventListener('dragleave', () => imageContainer.classList.remove('dragover'));
imageContainer.addEventListener('drop', event => {
    event.preventDefault();
    imageContainer.classList.remove('dragover');
    const file = event.dataTransfer.files[0];
    if (file && file.type === 'image/png') {
        const transfer = new DataTransfer();
        transfer.items.add(file);
        imageInput.files = transfer.files;
        imageInput.dispatchEvent(new Event('change'));
    }
});
imageInput.addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    currentFile = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    saveButton.disabled = true;
    removeAllButton.disabled = false;
    metadataStatus.textContent = 'Leyendo metadatos…';
    const formData = new FormData();
    formData.append('action', 'inspect');
    formData.append('image', file);
    try {
        const response = await fetch('/', { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'No se pudo leer la imagen');
        metadata = data.metadata || {};
        renderMetadata();
    } catch (error) {
        metadataStatus.textContent = error.message;
    }
});
</script>
</body>
</html>
